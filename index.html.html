<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>to: matti 🤍</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&display=swap" rel="stylesheet">
<style>
  :root{
    --kraft: #ded0b3;
    --kraft-dark: #c9b795;
    --ink: #4a3b2c;
    --maroon: #a95246;
    --maroon-dark: #7c3b32;
    --cream: #ffdbab;
    --rose: #d99aa0;
    --page-w: 1587;
    --page-h: 2245;
  }

  *{ box-sizing: border-box; }

  html,body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    background: var(--kraft);
    background-image:
      radial-gradient(circle at 20% 30%, rgba(255,255,255,0.10) 0, transparent 45%),
      radial-gradient(circle at 80% 70%, rgba(0,0,0,0.05) 0, transparent 50%);
    font-family: 'Cormorant Garamond', serif;
    color: var(--ink);
    overflow-x: hidden;
  }

  .stage{
    min-height: 100vh;
    min-height: 100dvh;
    width: 100%;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding-top: clamp(28px, 8vh, 90px);
    padding-bottom: 40px;
    position: relative;
  }

  /* ---------- BOOK WRAPPER ---------- */
  .book-wrapper{
    position: relative;
    width: min(46vw, 380px, 58vh);
    aspect-ratio: var(--page-w) / var(--page-h);
    transition: width 0.7s cubic-bezier(.65,.05,.36,1), max-width 0.7s cubic-bezier(.65,.05,.36,1);
  }
  @media (max-width: 720px){
    .book-wrapper{ width: min(84vw, 380px, 58vh); }
  }
  body.open .book-wrapper{
    width: min(88vw, 900px, 116vh);
    aspect-ratio: calc(var(--page-w) * 2) / var(--page-h);
  }
  @media (max-width: 720px){
    body.open .book-wrapper{ width: min(94vw, 900px, 116vh); }
  }

  .perspective{
    position: absolute;
    inset: 0;
    z-index: 2;
    perspective: 2400px;
    pointer-events: none;
  }

  /* ---------- SPREAD (behind cover) ---------- */
  .spread{
    position: absolute;
    inset: 0;
    z-index: 1;
    display: flex;
    border-radius: 6px;
    overflow: hidden;
    box-shadow: 0 30px 60px -20px rgba(40,25,10,0.45), 0 4px 18px rgba(40,25,10,0.25);
    background: #efe4cc;
    visibility: hidden;
    pointer-events: none;
    transition: visibility 0s linear 0.45s;
  }
  body.open .spread{
    visibility: visible;
    pointer-events: auto;
    transition: visibility 0s linear 0s;
  }
  .page{
    position: relative;
    width: 50%;
    height: 100%;
    overflow: hidden;
    background-size: cover;
    background-position: center;
  }
  .page.left{ border-right: 1px solid rgba(0,0,0,0.08); }
  .page-shadow-fold{
    position: absolute;
    top:0; bottom:0;
    width: 40px;
    pointer-events: none;
  }
  .page.left .page-shadow-fold{
    right: 0;
    background: linear-gradient(to right, transparent, rgba(0,0,0,0.16));
  }
  .page.right .page-shadow-fold{
    left: 0;
    background: linear-gradient(to left, transparent, rgba(0,0,0,0.16));
  }

  /* ---------- COVER (double doors) ---------- */
  .cover-half{
    position: absolute;
    top: 0; bottom: 0;
    width: 50%;
    height: 100%;
    background-repeat: no-repeat;
    background-size: 200% 100%;
    box-shadow: 0 30px 60px -20px rgba(40,25,10,0.45), 0 4px 18px rgba(40,25,10,0.25);
    cursor: pointer;
    backface-visibility: hidden;
    transition: transform 0.9s cubic-bezier(.65,.05,.36,1);
    border-radius: 6px;
    pointer-events: auto;
  }
  .cover-half.left{
    left: 0;
    transform-origin: left center;
    background-position: left center;
    border-radius: 6px 0 0 6px;
  }
  .cover-half.right{
    right: 0;
    transform-origin: right center;
    background-position: right center;
    border-radius: 0 6px 6px 0;
  }
  body.open .cover-half.left{
    transform: rotateY(-122deg);
    box-shadow: none;
  }
  body.open .cover-half.right{
    transform: rotateY(122deg);
    box-shadow: none;
  }
  body.open .cover-half{
    pointer-events: none;
  }
  .cover-hint{
    position: absolute;
    left: 50%;
    bottom: -34px;
    transform: translateX(-50%);
    font-family: 'Caveat', cursive;
    font-size: clamp(14px, 2.4vw, 18px);
    color: var(--ink);
    opacity: 0.65;
    white-space: nowrap;
    transition: opacity 0.4s ease;
    pointer-events: none;
  }
  body.open .cover-hint{ opacity: 0; }

  /* ---------- BACK TO COVER BUTTON ---------- */
  .back-btn{
    position: fixed;
    top: 18px;
    left: 18px;
    z-index: 50;
    font-family: 'Cormorant Garamond', serif;
    font-size: 15px;
    letter-spacing: 0.03em;
    background: rgba(255,255,255,0.75);
    border: 1px solid rgba(74,59,44,0.25);
    color: var(--ink);
    padding: 8px 16px;
    border-radius: 999px;
    cursor: pointer;
    opacity: 0;
    pointer-events: none;
    transform: translateY(-6px);
    transition: opacity 0.4s ease 0.3s, transform 0.4s ease 0.3s;
    backdrop-filter: blur(4px);
  }
  body.open .back-btn{
    opacity: 1;
    pointer-events: auto;
    transform: translateY(0);
  }
  .back-btn:hover{ background: rgba(255,255,255,0.95); }

  .letter-wrap{
    position: absolute;
    left: 50%;
    top: 46%;
    width: 78%;
    aspect-ratio: var(--page-w) / var(--page-h);
    transform: translate(-50%, -32%);
    transform-origin: center bottom;
    cursor: pointer;
    z-index: 5;
    opacity: 0;
    pointer-events: none;
    transition: transform 0.6s cubic-bezier(.4,.1,.2,1), top 0.6s cubic-bezier(.4,.1,.2,1), width 0.6s cubic-bezier(.4,.1,.2,1), filter 0.6s ease, opacity 0.45s ease;
    filter: drop-shadow(0 6px 10px rgba(40,25,10,0.25));
  }
  .letter-wrap img{
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
    border-radius: 2px;
  }
  .page.left.lifted .letter-wrap{
    top: 8%;
    width: 88%;
    transform: translate(-50%, 0);
    filter: drop-shadow(0 18px 30px rgba(40,25,10,0.4));
    z-index: 15;
    opacity: 1;
    pointer-events: auto;
  }
  .letter-tap-hint{
    position: absolute;
    left: 50%;
    bottom: 4%;
    transform: translateX(-50%);
    font-family: 'Caveat', cursive;
    font-size: clamp(12px, 1.6vw, 16px);
    color: var(--ink);
    background: rgba(255,255,255,0.6);
    padding: 3px 12px;
    border-radius: 999px;
    opacity: 0.8;
    pointer-events: none;
    transition: opacity 0.4s ease;
    z-index: 6;
    white-space: nowrap;
  }
  .page.left.lifted .letter-tap-hint{ opacity: 0; }

  }
  .candle-scene{
    position: absolute;
    inset: 0;
  }
  .flame{
    position: absolute;
    left: 44.05%;
    top: 22.27%;
    width: 8.19%;
    height: 7.97%;
    transform-origin: 50% 92%;
    z-index: 4;
    transition: opacity 0.5s ease, transform 0.4s ease;
  }
  .flame img{
    width: 100%;
    height: 100%;
    display: block;
    filter: drop-shadow(0 2px 4px rgba(90,30,20,0.35));
  }
  .flame.out{
    opacity: 0;
    transform: scale(0.3) translateY(6px);
  }
  .flame.relight-pop{
    animation: relightPop 0.5s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes relightPop{
    0%{ transform: scale(0.2) translateY(6px); opacity: 0; }
    60%{ transform: scale(1.15) translateY(-2px); opacity: 1; }
    100%{ transform: scale(1) translateY(0); opacity: 1; }
  }

  .controls-panel{
    position: absolute;
    left: 50%;
    bottom: 4%;
    transform: translateX(-50%);
    width: 84%;
    z-index: 6;
    text-align: center;
    background: rgba(253, 248, 238, 0.88);
    border: 1px solid rgba(74,59,44,0.15);
    border-radius: 16px;
    padding: 14px 12px 12px;
    backdrop-filter: blur(6px);
    box-shadow: 0 8px 20px rgba(60,40,20,0.15);
  }
  .meter-wrap{
    position: relative;
    width: 82%;
    max-width: 260px;
    margin: 0 auto;
    text-align: center;
  }
  .meter-label{
    font-family: 'Caveat', cursive;
    font-size: clamp(12px, 1.8vw, 16px);
    color: var(--ink);
    margin-bottom: 4px;
    opacity: 0.85;
  }
  .meter-track{
    width: 100%;
    height: 10px;
    border-radius: 999px;
    background: rgba(74,59,44,0.15);
    overflow: hidden;
    border: 1px solid rgba(74,59,44,0.25);
  }
  .meter-fill{
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--rose), var(--maroon));
    border-radius: 999px;
    transition: width 0.08s linear;
  }
  .mic-status{
    margin-top: 6px;
    font-size: clamp(10px, 1.4vw, 12.5px);
    color: var(--ink);
    opacity: 0.6;
    font-family: 'Cormorant Garamond', serif;
  }

  .fallback-btn{
    position: relative;
    display: inline-block;
    margin-top: 10px;
    z-index: 6;
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(11px, 1.6vw, 14px);
    background: rgba(255,255,255,0.8);
    border: 1px solid rgba(74,59,44,0.3);
    color: var(--ink);
    padding: 7px 16px;
    border-radius: 999px;
    cursor: pointer;
    user-select: none;
    touch-action: none;
    transition: background 0.2s ease, transform 0.15s ease;
  }
  .fallback-btn:active, .fallback-btn.pressed{
    background: var(--rose);
    color: #fff;
    transform: scale(0.97);
  }

  .https-note{
    position: relative;
    margin-top: 8px;
    font-size: clamp(9.5px, 1.4vw, 11.5px);
    color: var(--ink);
    opacity: 0.6;
    text-align: center;
    font-family: 'Cormorant Garamond', serif;
    line-height: 1.3;
  }

  /* wish overlay */
  .wish-overlay{
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    background: rgba(238, 224, 197, 0);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.6s ease, background 0.6s ease;
    z-index: 10;
    text-align: center;
    padding: 10%;
  }
  .wish-overlay.show{
    opacity: 1;
    pointer-events: auto;
    background: rgba(238, 224, 197, 0.55);
  }
  .wish-text{
    font-family: 'Caveat', cursive;
    font-size: clamp(22px, 4.2vw, 36px);
    color: var(--maroon-dark);
    margin: 0 0 14px 0;
    text-shadow: 0 2px 6px rgba(255,255,255,0.6);
  }
  .relight-btn{
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(12px, 1.8vw, 15px);
    letter-spacing: 0.04em;
    background: var(--maroon);
    color: #fff;
    border: none;
    padding: 9px 22px;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 6px 14px rgba(122,50,40,0.35);
    transition: transform 0.15s ease, background 0.2s ease;
  }
  .relight-btn:hover{ background: var(--maroon-dark); transform: translateY(-1px); }

  canvas.confetti{
    position: absolute;
    inset: 0;
    z-index: 9;
    pointer-events: none;
  }

  /* mobile stacking safeguard for extremely narrow / short screens */
  @media (max-width: 480px){
    .stage{ padding-top: 24px; }
  }
  body.open .stage{
    padding-top: clamp(16px, 4vh, 50px);
  }
</style>
</head>
<body>

<button class="back-btn" id="backBtn">‹ back to cover</button>

<div class="stage">
  <div class="book-wrapper" id="bookWrapper">

    <div class="spread">

<script>
(function(){
  "use strict";

  var body = document.body;
  var coverLeft = document.getElementById('coverLeft');
  var coverRight = document.getElementById('coverRight');
  var backBtn = document.getElementById('backBtn');
  var leftPage = document.getElementById('leftPage');
  var letterWrap = document.getElementById('letterWrap');

  function openBook(){
    body.classList.add('open');
  }
  function closeBook(){
    body.classList.remove('open');
    leftPage.classList.remove('lifted');
  }

  coverLeft.addEventListener('click', openBook);
  coverRight.addEventListener('click', openBook);
  backBtn.addEventListener('click', closeBook);

  letterWrap.addEventListener('click', function(e){
    e.stopPropagation();
    leftPage.classList.toggle('lifted');
  });

  leftPage.addEventListener('click', function(){
    if(!leftPage.classList.contains('lifted')){
      leftPage.classList.add('lifted');
    }
  });

  /* ================= CANDLE / BLOW LOGIC ================= */
  var flame = document.getElementById('flame');
  var meterFill = document.getElementById('meterFill');
  var micStatus = document.getElementById('micStatus');
  var meterLabel = document.getElementById('meterLabel');
  var fallbackBtn = document.getElementById('fallbackBtn');
  var wishOverlay = document.getElementById('wishOverlay');
  var relightBtn = document.getElementById('relightBtn');
  var confettiCanvas = document.getElementById('confettiCanvas');
  var rightPage = document.getElementById('rightPage');

  var audioCtx = null, analyser = null, micSource = null, micStream = null;
  var micActive = false;
  var candleLit = true;
  var blowLevel = 0;          // smoothed 0..1
  var blowAboveSince = null;  // timestamp when level crossed threshold
  var lastAboveTime = null;
  var rafId = null;

  var THRESHOLD = 0.10;
  var EXTINGUISH_MS = 500;
  var GRACE_MS = 180;

  function setMeter(level){
    var pct = Math.max(0, Math.min(1, level)) * 100;
    meterFill.style.width = pct + '%';
  }

  function bendFlame(level){
    if(!candleLit) return;
    var strength = Math.min(level / 0.35, 1);
    var angle = 18 + strength * 22;
    var wobble = (Math.random() - 0.5) * 6 * strength;
    flame.style.transform = 'rotate(' + (angle + wobble) + 'deg) scaleY(' + (1 - strength*0.18) + ')';
  }

  function resetFlameTransform(){
    flame.style.transform = 'rotate(0deg) scaleY(1)';
  }

  async function initMic(){
    if(micActive) return true;
    try{
      micStream = await navigator.mediaDevices.getUserMedia({ audio: {
        echoCancellation: false, noiseSuppression: false, autoGainControl: false
      } });
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      micSource = audioCtx.createMediaStreamSource(micStream);
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 1024;
      analyser.smoothingTimeConstant = 0.5;
      micSource.connect(analyser);
      micActive = true;
      micStatus.textContent = "listening… blow gently 🌬️";
      meterLabel.textContent = "mic level";
      loop();
      return true;
    }catch(err){
      micStatus.textContent = "mic unavailable — use the hold-to-blow button below";
      return false;
    }
  }

  function getRMS(){
    var data = new Uint8Array(analyser.fftSize);
    analyser.getByteTimeDomainData(data);
    var sum = 0;
    for(var i=0;i<data.length;i++){
      var v = (data[i] - 128) / 128;
      sum += v*v;
    }
    return Math.sqrt(sum / data.length);
  }

  function loop(){
    rafId = requestAnimationFrame(loop);
    if(!analyser || !candleLit) return;
    var rms = getRMS();
    // smooth
    blowLevel += (rms - blowLevel) * 0.35;
    setMeter(blowLevel * 3.2);

    var now = performance.now();
    if(blowLevel > THRESHOLD){
      lastAboveTime = now;
      if(blowAboveSince === null) blowAboveSince = now;
      bendFlame(blowLevel);
      if(now - blowAboveSince > EXTINGUISH_MS){
        extinguish();
      }
    } else {
      if(lastAboveTime !== null && (now - lastAboveTime) > GRACE_MS){
        blowAboveSince = null;
      }
      resetFlameTransform();
    }
  }

  function extinguish(){
    if(!candleLit) return;
    candleLit = false;
    flame.classList.add('out');
    setTimeout(function(){
      showWish();
    }, 350);
  }

  function showWish(){
    wishOverlay.classList.add('show');
    launchConfetti();
  }

  function relight(){
    candleLit = true;
    blowLevel = 0;
    blowAboveSince = null;
    lastAboveTime = null;
    setMeter(0);
    resetFlameTransform();
    flame.classList.remove('out');
    void flame.offsetWidth;
    flame.classList.add('relight-pop');
    setTimeout(function(){ flame.classList.remove('relight-pop'); }, 520);
    wishOverlay.classList.remove('show');
    clearConfetti();
  }

  relightBtn.addEventListener('click', function(e){
    e.stopPropagation();
    relight();
  });

  // tap flame / meter area to request mic permission
  rightPage.addEventListener('click', function(){
    if(!micActive) initMic();
  }, { once: false });

  /* ---------- fallback hold-to-blow ---------- */
  var holdInterval = null;
  var holdStart = null;

  function startHold(){
    if(!candleLit || holdInterval) return;
    fallbackBtn.classList.add('pressed');
    holdStart = performance.now();
    holdInterval = setInterval(function(){
      var elapsed = performance.now() - holdStart;
      var simulated = Math.min(0.9, elapsed / 400);
      blowLevel = simulated;
      setMeter(simulated * 1.1 + 0.15);
      bendFlame(simulated);
      if(elapsed > EXTINGUISH_MS){
        stopHold();
        extinguish();
      }
    }, 30);
  }

  function stopHold(){
    fallbackBtn.classList.remove('pressed');
    if(holdInterval){ clearInterval(holdInterval); holdInterval = null; }
    holdStart = null;
    if(candleLit){
      setMeter(0);
      resetFlameTransform();
    }
  }

  fallbackBtn.addEventListener('mousedown', function(e){ e.stopPropagation(); startHold(); });
  fallbackBtn.addEventListener('touchstart', function(e){ e.stopPropagation(); e.preventDefault(); startHold(); }, {passive:false});
  ['mouseup','mouseleave','touchend','touchcancel'].forEach(function(ev){
    fallbackBtn.addEventListener(ev, function(e){ e.stopPropagation(); stopHold(); });
  });

  document.addEventListener('keydown', function(e){
    if(e.code === 'Space' && !e.repeat){
      e.preventDefault();
      startHold();
    }
  });
  document.addEventListener('keyup', function(e){
    if(e.code === 'Space'){
      e.preventDefault();
      stopHold();
    }
  });

  /* ================= CONFETTI ================= */
  var ctx = confettiCanvas.getContext('2d');
  var confettiPieces = [];
  var confettiRafId = null;
  var confettiColors = ['#a95246', '#d99aa0', '#e8c07d', '#fffaf0', '#7c3b32'];

  function resizeCanvas(){
    var rect = rightPage.getBoundingClientRect();
    confettiCanvas.width = rect.width;
    confettiCanvas.height = rect.height;
  }

  function launchConfetti(){
    resizeCanvas();
    confettiPieces = [];
    var count = 90;
    for(var i=0;i<count;i++){
      confettiPieces.push({
        x: confettiCanvas.width/2 + (Math.random()-0.5)*40,
        y: confettiCanvas.height*0.35,
        vx: (Math.random()-0.5) * 6,
        vy: -Math.random()*6 - 2,
        size: 4 + Math.random()*5,
        color: confettiColors[Math.floor(Math.random()*confettiColors.length)],
        rot: Math.random()*Math.PI*2,
        vrot: (Math.random()-0.5) * 0.3,
        shape: Math.random() > 0.5 ? 'rect' : 'circle'
      });
    }
    if(confettiRafId) cancelAnimationFrame(confettiRafId);
    var startTime = performance.now();
    function tick(){
      ctx.clearRect(0,0,confettiCanvas.width, confettiCanvas.height);
      var elapsed = performance.now() - startTime;
      var alive = false;
      for(var i=0;i<confettiPieces.length;i++){
        var p = confettiPieces[i];
        p.vy += 0.13;
        p.x += p.vx;
        p.y += p.vy;
        p.rot += p.vrot;
        if(p.y < confettiCanvas.height + 20) alive = true;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.fillStyle = p.color;
        if(p.shape === 'rect'){
          ctx.fillRect(-p.size/2, -p.size/3, p.size, p.size*0.65);
        } else {
          ctx.beginPath();
          ctx.arc(0,0,p.size/2,0,Math.PI*2);
          ctx.fill();
        }
        ctx.restore();
      }
      if(alive && elapsed < 6000){
        confettiRafId = requestAnimationFrame(tick);
      } else {
        ctx.clearRect(0,0,confettiCanvas.width, confettiCanvas.height);
      }
    }
    confettiRafId = requestAnimationFrame(tick);
  }

  function clearConfetti(){
    if(confettiRafId) cancelAnimationFrame(confettiRafId);
    if(ctx) ctx.clearRect(0,0,confettiCanvas.width, confettiCanvas.height);
  }

  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

})();
</script>
